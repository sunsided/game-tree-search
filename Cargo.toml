[package]
name = "game-tree-search"
description = "Adversarial game-tree search for computer opponents in board, card and turn-based games: minimax, negamax, alpha-beta, principal variation search, MTD(f), iterative deepening with transposition tables, expectimax and Monte Carlo tree search"
version = "0.2.3"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/game-tree-search"
readme = "README.md"
keywords = ["minimax", "alpha-beta", "mcts", "game-tree", "search"]
categories = ["algorithms", "game-development", "no-std"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "docs/design/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[features]
## `MapTable`, a transposition table backed by a hash map, for keys that should never share
## a slot.
hashbrown = ["dep:hashbrown"]
## `RandCore`, which lets Monte Carlo tree search draw from any `rand_core::Rng`.
rand_core = ["dep:rand_core"]
## Searches on `std` threads, the one feature that needs `std`: root-parallel Monte Carlo
## tree search (`Mcts::search_parallel`) and Lazy SMP over a `SharedTable` (`deepen_shared`).
parallel = []

[dependencies]
# Hash map behind `MapTable`; no_std with its default hasher.
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"], optional = true }
# The generator interface behind `RandCore`; the version stochastic-search uses.
rand_core = { version = "0.10.1", default-features = false, optional = true }
# sqrt and ln for UCT under no_std, as in stochastic-search.
libm = "0.2.16"
# Shared Budget trait; re-exported from the crate root.
search-core = { version = "0.3.1", default-features = false }

[dev-dependencies]
# Benchmarks of the searches, tables and parallel searches (`task bench`).
criterion = "0.8.2"
# Property tests on generated game trees, tables and scores.
proptest = "1.12.0"

[target.'cfg(loom)'.dev-dependencies]
# Model checking of the lock-free PackedTable (`task test:loom`).
loom = "0.7.3"

[[bench]]
name = "search"
harness = false

[[bench]]
name = "parallel"
harness = false
required-features = ["parallel"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[lints.rust]
missing_docs = "warn"
# The loom models of PackedTable build with `--cfg loom`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"
